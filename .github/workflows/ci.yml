name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a new release of any measured framework is caught even when
    # nothing in this repo changed.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: build (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

  smoke:
    name: smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # A shared CI runner cannot produce numbers worth publishing, but it can
      # prove the harness still works: every framework starts, answers every
      # scenario with the expected body, and survives being measured. The run
      # exits non-zero if any response differs.
      - name: benchmark harness runs and every framework passes the gate
        run: |
          go run ./cmd/goichi-bench \
            -duration 300ms -warmup 100ms -repeat 1 \
            -benchtime 50ms -connections 8 \
            -out "${RUNNER_TEMP}/ci.json"

      - name: report renders
        run: go run ./cmd/report -in "${RUNNER_TEMP}/ci.json" -out "${RUNNER_TEMP}/docs"

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
